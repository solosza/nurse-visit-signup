<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<!-- No month here: render() sets the real period once the data is loaded. A hardcoded
     month in the static title lies before the first load and stays lying if it fails. -->
<title>Nurse Visit Sign-Up</title>
<style>
  :root {
    --bg: #FBF9F7;
    --ink: #2B2A33;
    --card-border: #ECE7E3;
    --muted: #A08A93;
    --muted2: #C7BFC4;
    --gold: #B8905A;
    --pink: #B8637A;
    --green: #4E8D6E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    padding-bottom: 48px;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .fade { animation: fadeIn 0.25s ease-out; }
  input:focus, button:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }

  /* Header */
  .hdr {
    background: linear-gradient(135deg, #4A3F55 0%, #6B5570 100%);
    padding: 28px 20px 22px;
    color: var(--bg);
  }
  .hdr .eyebrow {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    opacity: 0.75; margin-bottom: 6px; font-weight: 600;
  }
  .hdr .title { font-size: 22px; font-weight: 700; font-family: Georgia, serif; }
  .hdr .backrow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .hdr .back {
    background: rgba(255,255,255,0.15); border: none; color: var(--bg);
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 8px; cursor: pointer;
  }
  .hdr .back:hover { background: rgba(255,255,255,0.25); }
  .hdr .daytitle { font-size: 20px; font-weight: 700; font-family: Georgia, serif; }
  .hdr .covered { font-size: 12px; opacity: 0.8; margin-top: 4px; font-weight: 600; }

  /* Identity bar */
  .whoami {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 12px; color: var(--muted); padding: 10px 14px 0; text-align: center;
  }
  .whoami b { color: var(--ink); }
  .whoami button {
    background: none; border: none; color: var(--pink); font-size: 12px;
    font-weight: 600; cursor: pointer; padding: 2px 4px; text-decoration: underline;
  }

  /* Month grid */
  .gridwrap { padding: 14px 14px 0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 7px; }
  .day {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    padding: 10px 2px; border-radius: 10px; border: 1.5px solid var(--card-border);
    background: #fff; cursor: pointer; box-shadow: rgba(43,42,51,0.05) 0 1px 2px;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .day:hover { transform: translateY(-1px); border-color: var(--muted2); }
  .day .dow { font-size: 9px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
  .day .num { font-size: 15px; font-weight: 700; color: var(--ink); }
  .day .cnt { font-size: 9px; font-weight: 700; }
  .cnt.zero { color: var(--muted2); }
  .cnt.some { color: var(--gold); }
  .cnt.full { color: var(--green); }

  .hint { text-align: center; font-size: 11px; color: var(--muted); margin: 18px 20px; }
  .foot { text-align: center; font-size: 11px; color: var(--muted); margin-top: 18px; padding: 0 20px; }

  /* Day detail */
  .daywrap { padding: 14px 14px 0; }
  .section-label {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
    font-weight: 700; margin: 18px 4px 8px;
  }
  .section-label:first-child { margin-top: 6px; }
  .visit {
    display: flex; gap: 12px; background: #fff; border: 1.5px solid var(--card-border);
    border-radius: 12px; padding: 12px 12px; margin-bottom: 8px; box-shadow: rgba(43,42,51,0.05) 0 1px 2px;
  }
  .visit.claimed { background: #F4F8F5; border-color: #D5E7DD; }
  .vtime { display: flex; flex-direction: column; align-items: center; min-width: 46px; padding-top: 2px; }
  .vtime .t { font-size: 15px; font-weight: 700; color: var(--ink); line-height: 1.1; }
  .vtime .ap { font-size: 10px; font-weight: 700; color: var(--muted); }
  .vbody { flex: 1; min-width: 0; }
  .vpatient { font-size: 15px; font-weight: 700; color: var(--ink); }
  .vloc { font-size: 12px; color: var(--muted); font-weight: 600; margin-left: 6px; }
  .vtask { font-size: 12.5px; color: #55505A; margin-top: 3px; line-height: 1.35; }
  .vaction { margin-top: 9px; }
  .btn-signup {
    background: var(--pink); color: #fff; border: none; font-size: 12.5px; font-weight: 700;
    padding: 7px 14px; border-radius: 8px; cursor: pointer;
  }
  .btn-signup:hover { filter: brightness(1.05); }
  .claimed-by { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .claimed-by .tag {
    font-size: 12.5px; font-weight: 700; color: var(--green);
    display: inline-flex; align-items: center; gap: 5px;
  }
  .claimed-by .release {
    background: none; border: none; color: var(--muted); font-size: 12px;
    text-decoration: underline; cursor: pointer; font-weight: 600; padding: 0;
  }

  /* Loading / toast */
  .loading { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
  .spinner {
    width: 22px; height: 22px; border: 2.5px solid var(--card-border); border-top-color: var(--pink);
    border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600; box-shadow: rgba(0,0,0,0.2) 0 4px 16px;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 50; max-width: 88%;
  }
  .toast.show { opacity: 1; }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--green); margin-right: 5px; vertical-align: middle;
  }
  .live-dot.off { background: var(--muted2); }

  /* Dev-data banner. Deliberately loud: a staging page that looks identical to
     the live one is worse than no staging page, because you cannot tell which
     data you are about to change. */
  .envbar {
    background: #8A4B2A; color: #fff; font-size: 12px; font-weight: 700;
    text-align: center; padding: 7px 14px; letter-spacing: 0.04em;
  }
  .envbar code {
    background: rgba(255,255,255,0.18); padding: 1px 5px; border-radius: 4px;
    font-size: 11.5px;
  }

  /* Passcode gate */
  .gate { padding: 28px 20px; text-align: center; }
  .gatetext { font-size: 13.5px; color: #55505A; margin: 0 0 16px; line-height: 1.5; }
  .gaterow { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .gaterow input {
    flex: 1 1 200px; max-width: 260px; font-size: 16px; /* 16px stops iOS zooming on focus */
    padding: 9px 12px; border: 1.5px solid var(--card-border); border-radius: 8px;
    background: #fff; color: var(--ink);
  }
  .gateerr { font-size: 12.5px; color: var(--pink); font-weight: 600; margin: 14px 0 0; }

  /* View switcher */
  .tabs { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; }
  .tab {
    background: rgba(255,255,255,0.14); border: none; color: var(--bg);
    font-size: 12.5px; font-weight: 700; padding: 6px 11px; border-radius: 999px;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  }
  .tab:hover { background: rgba(255,255,255,0.24); }
  .tab.on { background: var(--bg); color: #4A3F55; }
  .pill {
    background: var(--pink); color: #fff; font-size: 10.5px; font-weight: 700;
    border-radius: 999px; padding: 1px 6px; min-width: 16px; text-align: center;
  }
  .tab.on .pill { background: var(--pink); color: #fff; }

  /* Month navigation */
  .monthnav { display: flex; align-items: center; gap: 12px; margin-top: 2px; }
  .mlabel { font-size: 20px; font-weight: 700; font-family: Georgia, serif; }
  .mnav {
    background: rgba(255,255,255,0.15); border: none; color: var(--bg);
    font-size: 17px; line-height: 1; font-weight: 700; width: 30px; height: 30px;
    border-radius: 8px; cursor: pointer;
  }
  .mnav:hover:not(:disabled) { background: rgba(255,255,255,0.28); }
  .mnav:disabled { opacity: 0.28; cursor: default; }

  /* Empty states */
  .empty { text-align: center; padding: 44px 24px; color: var(--muted); font-size: 13.5px; line-height: 1.5; }
  .emptyact { margin-top: 16px; }

  /* Date line inside a card, used where the card is away from its day heading */
  .vdate { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase;
           letter-spacing: 0.06em; margin-bottom: 3px; }

  /* Facility grouping */
  .fachead {
    display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
    margin: 22px 4px 4px; padding-bottom: 6px; border-bottom: 2px solid var(--card-border);
  }
  .fachead:first-child { margin-top: 6px; }
  .facname { font-size: 16px; font-weight: 700; font-family: Georgia, serif; color: var(--ink); }
  .faccount { font-size: 11.5px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .facday {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);
    font-weight: 700; margin: 14px 4px 7px;
  }

  /* Facility calendar. Laid out like the paper version: weekday columns, dates
     in the corner, every visit listed in its day cell. */
  .calwrap { padding: 12px 10px 0; }
  .calhead {
    background: linear-gradient(135deg, #4A3F55 0%, #6B5570 100%);
    color: var(--bg); border-radius: 10px 10px 0 0; padding: 12px 14px; margin-top: 22px;
  }
  .calhead:first-child { margin-top: 4px; }
  .calmonth { font-size: 22px; font-weight: 700; font-family: Georgia, serif; line-height: 1.1; }
  .calfac {
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    font-weight: 700; opacity: 0.9; margin-top: 3px;
  }
  .calpat { opacity: 0.75; font-weight: 600; }
  .calsep { opacity: 0.45; font-weight: 400; }
  .calcount { font-size: 11.5px; opacity: 0.8; font-weight: 600; margin-top: 4px; }

  .calgrid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    border: 1px solid var(--card-border); border-radius: 0 0 10px 10px;
    overflow: hidden; background: var(--card-border); gap: 1px;
  }
  .caldow {
    background: #EFEAE6; color: #6B6470; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em; text-align: center; padding: 6px 2px;
  }
  .calcell {
    background: #fff; min-height: 74px; padding: 4px 4px 6px; cursor: pointer;
    display: flex; flex-direction: column; gap: 2px;
  }
  .calcell:hover { background: #FCFAF8; }
  .calcell.empty { background: #F7F4F1; cursor: default; }
  .calcell.quiet { background: #FCFBFA; }
  .caldate { font-size: 11px; font-weight: 700; color: var(--ink); text-align: right; opacity: 0.65; }
  .calslot { font-size: 9.5px; line-height: 1.3; word-break: break-word; }
  .caltime { color: var(--muted); font-weight: 700; }
  /* Open slots are deliberately faint. They must be visible, because spotting an
     unfilled visit is the whole job, but they must not shout over the names.
     Some facilities have four open slots every single day. */
  .calopen { color: #CFC7CC; font-weight: 600; font-style: italic; }
  .calslot.free .caltime { color: #CFC7CC; font-weight: 600; }

  /* The colour-coded nurse name. Same chip everywhere a name appears. */
  .nchip {
    display: inline-block; padding: 0 4px; border-radius: 3px;
    font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom;
  }

  /* Phones: the calendar is the point, so give it the full width and shrink the
     type rather than letting cells collapse or scroll sideways. */
  @media (max-width: 560px) {
    .calwrap { padding: 10px 6px 0; }
    .calcell { min-height: 62px; padding: 3px 2px 4px; }
    .calslot { font-size: 8.5px; }
    .caldate { font-size: 10px; }
    .calmonth { font-size: 19px; }
  }
</style>
</head>
<body>
<div id="envbar"></div>
<div class="wrap">
  <div id="header"></div>
  <div id="whoami" class="whoami"></div>
  <div id="content">
    <div class="loading"><div class="spinner"></div>Loading schedule…</div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://toqcipuepxdmlhkpjozw.supabase.co";
  var SUPABASE_KEY = "sb_publishable_hKZKOQGTihooRc4InIU0VA_19KqKGoM";

  // --- which data does this page talk to? ---
  //
  // This page is a static file, so a git branch protects the HTML and nothing
  // else: a branch copy opened on a laptop still writes to real sign-ups unless
  // it is pointed somewhere else. The default is therefore INVERTED. Only the
  // real published URL gets the live table; everywhere else -- localhost,
  // file://, a staging repo -- gets the dev copy. You have to actually be on
  // the live site to touch live data by accident.
  //
  //   ?dev=1    force the dev table, including on the live site
  //   ?prod=1   force the live table, e.g. to read prod from a local checkout
  var IS_LIVE_SITE = location.hostname === "solosza.github.io" &&
                     location.pathname.indexOf("/nurse-visit-signup/") === 0;
  var USE_DEV = /[?&]dev=1/.test(location.search) ||
                (!/[?&]prod=1/.test(location.search) && !IS_LIVE_SITE);
  var TABLE = USE_DEV ? "visits_dev" : "visits";

  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var state = {
    visits: [],            // all rows
    byId: {},              // id -> row
    selectedDate: null,    // 'YYYY-MM-DD' or null (month view)
    nurse: localStorage.getItem("nurseName") || "",
    live: false,
    locked: false,         // true while the passcode gate is showing
    view: "month",         // "month" | "mine" | "facility"
    month: null            // 'YYYY-MM' currently shown; null until data loads
  };

  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var DOW_LONG = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function el(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c];
    });
  }
  function parseDate(iso) { // 'YYYY-MM-DD' -> local Date (no TZ shift)
    var p = iso.split("-"); return new Date(+p[0], +p[1]-1, +p[2]);
  }

  var toastTimer;
  function toast(msg) {
    var t = el("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  function getNurse() {
    if (state.nurse) return state.nurse;
    var name = window.prompt("Enter your name so others can see who signed up:");
    if (name && name.trim()) {
      state.nurse = name.trim();
      localStorage.setItem("nurseName", state.nurse);
      renderWhoami();
    }
    return state.nurse;
  }
  function changeNurse() {
    var name = window.prompt("Your name:", state.nurse || "");
    if (name && name.trim()) {
      state.nurse = name.trim();
      localStorage.setItem("nurseName", state.nurse);
      renderWhoami(); render();
    }
  }

  // ---- data ----
  function indexVisits() {
    state.byId = {};
    for (var i = 0; i < state.visits.length; i++) state.byId[state.visits[i].id] = state.visits[i];
  }
  function countFor(dateIso) {
    var total = 0, claimed = 0;
    for (var i = 0; i < state.visits.length; i++) {
      if (state.visits[i].visit_date === dateIso) { total++; if (state.visits[i].claimed_by) claimed++; }
    }
    return { total: total, claimed: claimed };
  }
  function datesList() {
    var seen = {}, out = [];
    for (var i = 0; i < state.visits.length; i++) {
      var d = state.visits[i].visit_date;
      if (!seen[d]) { seen[d] = 1; out.push(d); }
    }
    out.sort();
    return out;
  }

  // ---- months ----
  //
  // The schedule is no longer assumed to be one month. Everything below works off
  // whatever months actually exist in the data, so adding September rows is the
  // only step needed to get a September view -- no code change, no redeploy.

  function monthKey(iso) { return iso.slice(0, 7); }          // 'YYYY-MM-DD' -> 'YYYY-MM'

  function monthsList() {
    var seen = {}, out = [];
    for (var i = 0; i < state.visits.length; i++) {
      var k = monthKey(state.visits[i].visit_date);
      if (!seen[k]) { seen[k] = 1; out.push(k); }
    }
    out.sort();
    return out;
  }

  function monthTitle(ym) {
    if (!ym) return "";
    var p = ym.split("-");
    return MONTHS[+p[1] - 1] + " " + p[0];
  }

  function datesInMonth(ym) {
    return datesList().filter(function (d) { return monthKey(d) === ym; });
  }

  function visitsInMonth(ym) {
    return state.visits.filter(function (v) { return monthKey(v.visit_date) === ym; });
  }

  // Land on the month the user is most likely to want: the one we are in, if it
  // has visits; otherwise the next upcoming month; otherwise the most recent one.
  // Falling back to "the first month in the table" would show August forever.
  function defaultMonth() {
    var months = monthsList();
    if (!months.length) return null;
    var now = new Date();
    var thisMonth = now.getFullYear() + "-" + String(now.getMonth() + 1).padStart(2, "0");
    if (months.indexOf(thisMonth) !== -1) return thisMonth;
    for (var i = 0; i < months.length; i++) if (months[i] > thisMonth) return months[i];
    return months[months.length - 1];
  }

  // ---- nurse colours ----
  //
  // Colours are DERIVED from the name, never stored and never configured. A new
  // nurse gets a colour the first time she signs up, with no edit to this file
  // and no row in any table. That is the whole point: adding people has to be
  // free, because it will happen constantly and nobody is going to come back
  // here to maintain a list.
  //
  // The hash is deterministic, so the same name always gets the same colour on
  // every device and every reload.
  var NURSE_COLOURS = [
    { bg: "#FFF3A3", fg: "#4A3F00" },   // yellow
    { bg: "#A8E6CF", fg: "#0B3D2E" },   // green
    { bg: "#AEE7F8", fg: "#06384A" },   // cyan
    { bg: "#F8B8D0", fg: "#5A0B2B" },   // pink
    { bg: "#FFC9A3", fg: "#5A2A00" },   // orange
    { bg: "#D5C4F1", fg: "#2E1A5A" },   // purple
    { bg: "#B8E0A0", fg: "#1F3D0B" },   // lime
    { bg: "#F9AFAF", fg: "#5A0B0B" },   // red
    { bg: "#BFD4F2", fg: "#122A55" },   // blue
    { bg: "#EFD3A3", fg: "#4A3208" },   // sand
    { bg: "#C9EDE4", fg: "#0C3B33" },   // teal
    { bg: "#F3C6E8", fg: "#4E0F42" },   // orchid
    { bg: "#E2E8A8", fg: "#3B3F0B" },   // olive
    { bg: "#CFCFEA", fg: "#26264F" },   // periwinkle
    { bg: "#FBD3B8", fg: "#5A2E10" },   // peach
    { bg: "#B9E3C6", fg: "#12401F" }    // mint
  ];

  // Colours are assigned by POSITION in the sorted list of nurses who actually
  // appear in the data, not by hashing the name.
  //
  // Hashing was tried first and is wrong here. With ten colours and six nurses a
  // collision is more likely than not, and it happened immediately: two nurses
  // came out the same shade of green. Colour coding whose whole job is telling
  // people apart cannot hand two people the same colour.
  //
  // Position-based assignment guarantees every nurse on screen is distinct, and
  // stays stable as long as the roster does. Adding a nurse still needs no
  // configuration: she appears in the data, she gets the next colour.
  var _colourMap = null;

  function rebuildColourMap() {
    var seen = {};
    state.visits.forEach(function (v) {
      if (v.claimed_by) seen[v.claimed_by.trim().toLowerCase()] = 1;
    });
    _colourMap = {};
    Object.keys(seen).sort().forEach(function (n, i) {
      _colourMap[n] = NURSE_COLOURS[i % NURSE_COLOURS.length];
    });
  }

  function nurseColour(name) {
    var key = String(name || "").trim().toLowerCase();
    if (!key) return null;
    if (!_colourMap) rebuildColourMap();
    return _colourMap[key] || NURSE_COLOURS[0];
  }

  function nurseChipHTML(name) {
    var c = nurseColour(name);
    if (!c) return "";
    return '<span class="nchip" style="background:' + c.bg + ';color:' + c.fg + '">' + esc(name) + '</span>';
  }

  // ---- facilities ----
  //
  // Read straight out of the data. Adding a facility means adding visits with a
  // new location; nothing here changes. Visits with no location are kept under
  // their own heading rather than dropped.
  var NO_FACILITY = "￿";

  function facilityLabel(key) { return key === NO_FACILITY ? "No facility listed" : key; }

  function facilitiesIn(visits) {
    var seen = {};
    visits.forEach(function (v) { seen[v.location || NO_FACILITY] = 1; });
    return Object.keys(seen).sort();
  }

  // The patient a facility belongs to, if it is consistent. Shown in the
  // calendar header the way the paper version does it. If a facility ever has
  // more than one patient this returns null and the header just omits it,
  // rather than picking one arbitrarily.
  function patientFor(visits, facilityKey) {
    var names = {};
    visits.forEach(function (v) {
      if ((v.location || NO_FACILITY) === facilityKey && v.patient_name) names[v.patient_name] = 1;
    });
    var list = Object.keys(names);
    return list.length === 1 ? list[0] : null;
  }

  // ---- calendar grid ----
  //
  // Builds the weeks of a month as a Sunday-first grid, padded with nulls so the
  // dates land under the right weekday. Returns [[Date|null x7], ...].
  function monthGrid(ym) {
    var p = ym.split("-"), year = +p[0], month = +p[1] - 1;
    var first = new Date(year, month, 1);
    var days = new Date(year, month + 1, 0).getDate();
    var cells = [];
    for (var b = 0; b < first.getDay(); b++) cells.push(null);
    for (var d = 1; d <= days; d++) cells.push(new Date(year, month, d));
    while (cells.length % 7) cells.push(null);
    var weeks = [];
    for (var i = 0; i < cells.length; i += 7) weeks.push(cells.slice(i, i + 7));
    return weeks;
  }

  function isoOf(date) {
    return date.getFullYear() + "-" +
           String(date.getMonth() + 1).padStart(2, "0") + "-" +
           String(date.getDate()).padStart(2, "0");
  }

  function isMine(v) {
    return !!(v.claimed_by && state.nurse &&
              v.claimed_by.trim().toLowerCase() === state.nurse.trim().toLowerCase());
  }

  // Scoped to a month when ym is given ('YYYY-MM'), otherwise every month.
  //
  // The scope is not cosmetic. Until 2026-08-31 the table held August only, so
  // "all my visits" and "my visits this month" were the same number and the
  // unscoped count was right by accident. The moment September, October and
  // November were generated, the badge started reading 40 while the page showed
  // September, where the same nurse had none. A count next to a month selector
  // has to mean that month.
  function myVisits(ym) {
    return state.visits.filter(function (v) {
      return isMine(v) && (!ym || monthKey(v.visit_date) === ym);
    }).sort(function (a, b) {
      return a.visit_date < b.visit_date ? -1 : a.visit_date > b.visit_date ? 1 : a.sort_order - b.sort_order;
    });
  }

  // The label follows the data instead of being hardcoded, so the header cannot
  // go on claiming "August 2026" once the schedule moves past August. Handles a
  // span, because an ongoing schedule will routinely cross a month boundary.
  function periodLabel() {
    var dates = datesList();
    if (!dates.length) return "";
    var a = parseDate(dates[0]), b = parseDate(dates[dates.length - 1]);
    if (a.getFullYear() === b.getFullYear()) {
      if (a.getMonth() === b.getMonth()) return MONTHS[a.getMonth()] + " " + a.getFullYear();
      return MONTHS[a.getMonth()] + " – " + MONTHS[b.getMonth()] + " " + a.getFullYear();
    }
    return MONTHS[a.getMonth()] + " " + a.getFullYear() + " – " + MONTHS[b.getMonth()] + " " + b.getFullYear();
  }

  // A refusal caused by not being signed in, as opposed to a genuine error.
  // Postgres returns 42501 for a missing privilege; PostgREST surfaces RLS
  // refusals as PGRST301/401. Anything else is a real fault and must not be
  // disguised as a login prompt.
  function isAuthError(err) {
    if (!err) return false;
    var code = String(err.code || "");
    return code === "42501" || code === "PGRST301" || err.status === 401 ||
           /permission denied|jwt|not authorized/i.test(err.message || "");
  }

  async function loadAll() {
    var res = await sb.from(TABLE).select("*").order("visit_date", { ascending: true }).order("sort_order", { ascending: true });
    if (res.error) {
      // Not signed in -> ask for the passcode rather than showing an error.
      // This is what makes the rollout need no coordinated deploy: while the
      // table is still readable anonymously the gate never appears, and the
      // moment 003b restricts it, every page starts asking. Same file either way.
      if (isAuthError(res.error)) { renderPasscodeGate(); return; }

      // Name the table in the message. On the dev copy the overwhelmingly likely
      // cause is that the migration has not been run yet, and "please refresh"
      // sends you round that loop forever.
      el("content").innerHTML =
        '<div class="loading">Could not load the schedule from <b>' + esc(TABLE) + '</b>.<br>' +
        esc(res.error.message || "Unknown error") +
        (USE_DEV ? '<br><br>If this table does not exist yet, run <code>db/001-create-dev-tables.sql</code> in the Supabase SQL editor.' : '') +
        '</div>';
      return;
    }
    state.visits = res.data || [];
    state.locked = false;
    indexVisits();
    // Pick the month on first load, and re-pick if the current selection no
    // longer exists -- the schedule can change under a page that stays open.
    if (!state.month || monthsList().indexOf(state.month) === -1) state.month = defaultMonth();
    render();
  }

  // ---- passcode gate ----
  //
  // The passcode is the password of one shared Supabase Auth account. It is
  // never stored in this file: the page collects it, exchanges it for a session,
  // and supabase-js keeps that session in localStorage so it survives reloads.
  // Gating the markup would protect nothing on its own -- the data is served by
  // PostgREST and the publishable key is public -- so the real control is the RLS
  // policy behind it. This screen is how a nurse gets past that policy, not the
  // policy itself.
  var SHARED_ACCOUNT = "nurses@nursevisitsignup.app";

  function renderPasscodeGate(message) {
    state.locked = true;
    el("header").innerHTML =
      '<div class="hdr">' +
        '<div class="eyebrow">Nurse Visit Sign-Up</div>' +
        '<div class="title">Enter the passcode</div>' +
      '</div>';
    el("whoami").innerHTML = "";
    el("content").innerHTML =
      '<div class="gate fade">' +
        '<p class="gatetext">This schedule is private. Enter the passcode your coordinator gave you.</p>' +
        '<div class="gaterow">' +
          '<input id="pc" type="password" inputmode="text" autocomplete="current-password" ' +
                 'placeholder="passcode" aria-label="Passcode" />' +
          '<button id="pcgo" class="btn-signup">Enter</button>' +
        '</div>' +
        (message ? '<p class="gateerr">' + esc(message) + '</p>' : '') +
      '</div>';
    var input = el("pc"), go = el("pcgo");
    var submit = async function () {
      var code = (input.value || "").trim();
      if (!code) return;
      go.disabled = true; go.textContent = "Checking…";
      var res = await sb.auth.signInWithPassword({ email: SHARED_ACCOUNT, password: code });
      if (res.error) {
        renderPasscodeGate("That passcode was not recognised.");
        return;
      }
      state.signedIn = true;
      el("content").innerHTML = '<div class="loading"><div class="spinner"></div>Loading schedule…</div>';
      await loadAll();
      renderWhoami();             // now that a session exists, offer sign-out
      subscribeLive();            // the boot subscription, if any, was made without a session
    };
    go.onclick = submit;
    input.onkeydown = function (e) { if (e.key === "Enter") submit(); };
    input.focus();
  }

  async function signOut() {
    await sb.auth.signOut();
    state.visits = []; state.byId = {}; state.selectedDate = null; state.signedIn = false;
    renderPasscodeGate();
  }

  function subscribeLive() {
    sb.channel("visits-live-" + TABLE)
      .on("postgres_changes", { event: "*", schema: "public", table: TABLE }, function (payload) {
        var row = payload.new;
        if (!row || !row.id) return;
        if (state.byId[row.id]) {
          // update in place
          var cur = state.byId[row.id];
          for (var k in row) cur[k] = row[k];
        } else {
          state.visits.push(row); state.byId[row.id] = row;
        }
        render();
      })
      .subscribe(function (status) {
        state.live = (status === "SUBSCRIBED");
        renderFoot();
      });
  }

  // ---- actions ----
  async function claim(id) {
    var nurse = getNurse();
    if (!nurse) return;
    var res = await sb.from(TABLE)
      .update({ claimed_by: nurse, claimed_at: new Date().toISOString() })
      .eq("id", id).is("claimed_by", null).select();
    if (res.error) { toast("Something went wrong — try again."); return; }
    if (!res.data || !res.data.length) {
      // someone beat us to it — refresh that row
      var one = await sb.from(TABLE).select("*").eq("id", id).single();
      if (one.data) { state.byId[id] && (function(){ var c = state.byId[id]; for (var k in one.data) c[k] = one.data[k]; })(); render(); }
      toast("Just taken by someone else.");
      return;
    }
    var c = state.byId[id]; var nw = res.data[0]; for (var k in nw) c[k] = nw[k];
    render(); toast("You're signed up.");
  }

  async function release(id) {
    var res = await sb.from(TABLE)
      .update({ claimed_by: null, claimed_at: null })
      .eq("id", id).select();
    if (res.error) { toast("Something went wrong — try again."); return; }
    if (res.data && res.data.length) { var c = state.byId[id], nw = res.data[0]; for (var k in nw) c[k] = nw[k]; }
    render(); toast("Sign-up removed.");
  }

  // ---- rendering ----
  function renderWhoami() {
    var w = el("whoami");
    if (state.locked) { w.innerHTML = ""; return; }
    if (state.nurse) {
      w.innerHTML = 'Signing up as <b>' + esc(state.nurse) + '</b> <button id="chg">change</button>';
    } else {
      w.innerHTML = '<button id="chg">Set your name</button>';
    }
    // Only offer sign-out once a session actually exists, so the control does not
    // appear on a page that never required one.
    if (state.signedIn) w.innerHTML += ' <button id="sout">sign out</button>';
    var b = document.getElementById("chg"); if (b) b.onclick = changeNurse;
    var s = document.getElementById("sout"); if (s) s.onclick = signOut;
  }

  function renderFoot() {
    el("foot").innerHTML =
      '<span class="live-dot ' + (state.live ? "" : "off") + '"></span>' +
      (state.live ? "Live · updates for everyone in real time" : "Shared with all nurses on this schedule");
  }

  function render() {
    rebuildColourMap();
    if (state.selectedDate) renderDay();
    else viewById(state.view).draw();
    renderFoot();
    var p = state.month ? monthTitle(state.month) : periodLabel();
    document.title = "Nurse Visit Sign-Up" + (p ? " · " + p : "") + (USE_DEV ? " [DEV]" : "");
  }

  // The three top-level views. Rendered as part of the header so they survive
  // every re-render, including the ones realtime triggers.
  // The views, in one place. Adding a view means adding an entry here and a
  // render function; nothing else in the file needs to know about it.
  //   id     what state.view is set to
  //   label  the tab caption
  //   badge  optional count shown as a pill
  //   draw   the render function
  var VIEWS = [
    { id: "month",    label: "Schedule",    draw: function () { renderMonth(); } },
    { id: "mine",     label: "My visits",   draw: function () { renderMine(); },
      badge: function () { return myVisits(state.month).length; } },
    { id: "facility", label: "By facility", draw: function () { renderFacility(); } }
  ];

  function viewById(id) {
    for (var i = 0; i < VIEWS.length; i++) if (VIEWS[i].id === id) return VIEWS[i];
    return VIEWS[0];
  }

  function tabsHTML() {
    var out = '<div class="tabs">';
    VIEWS.forEach(function (v) {
      var n = v.badge ? v.badge() : 0;
      out += '<button class="tab' + (state.view === v.id ? " on" : "") + '" data-view="' + v.id + '">' +
             v.label + (n ? ' <span class="pill">' + n + '</span>' : "") + '</button>';
    });
    return out + '</div>';
  }

  function wireTabs() {
    var t = document.querySelectorAll(".tab");
    for (var i = 0; i < t.length; i++) {
      t[i].onclick = (function (v) {
        return function () { state.view = v; state.selectedDate = null; window.scrollTo(0, 0); render(); };
      })(t[i].getAttribute("data-view"));
    }
  }

  // One visit card, used by the day view, My visits and By facility. Kept in a
  // single function so the three views cannot drift apart, and so claim/release
  // is wired the same way everywhere.
  function visitCardHTML(v, opts) {
    opts = opts || {};
    var tparts = splitTime(v.time_label);
    var claimed = !!v.claimed_by;
    var mine = isMine(v);
    return '<div class="visit' + (claimed ? " claimed" : "") + '">' +
      '<div class="vtime"><span class="t">' + esc(tparts[0]) + '</span><span class="ap">' + esc(tparts[1]) + '</span></div>' +
      '<div class="vbody">' +
        (opts.showDate ? '<div class="vdate">' + esc(longDate(v.visit_date)) + '</div>' : '') +
        '<div><span class="vpatient">' + esc(v.patient_name || "Visit") + '</span>' +
          (opts.hideLocation || !v.location ? '' : '<span class="vloc">' + esc(v.location) + '</span>') + '</div>' +
        (v.task ? '<div class="vtask">' + esc(v.task) + '</div>' : '') +
        (claimed
          ? '<div class="claimed-by"><span class="tag">✓ </span>' + nurseChipHTML(v.claimed_by) +
              '<button class="release" data-id="' + v.id + '">' + (mine ? "Cancel my sign-up" : "Remove") + '</button></div>'
          : '<div class="vaction"><button class="btn-signup" data-id="' + v.id + '">Sign up for this visit</button></div>') +
      '</div>' +
    '</div>';
  }

  function wireVisitButtons() {
    var signs = el("content").querySelectorAll(".btn-signup");
    for (var s = 0; s < signs.length; s++) {
      signs[s].onclick = (function (id) { return function () { claim(id); }; })(signs[s].getAttribute("data-id"));
    }
    var rels = el("content").querySelectorAll(".release");
    for (var r = 0; r < rels.length; r++) {
      rels[r].onclick = (function (id) {
        return function () { if (window.confirm("Remove this sign-up?")) release(id); };
      })(rels[r].getAttribute("data-id"));
    }
  }

  function longDate(iso) {
    var d = parseDate(iso);
    return DOW_LONG[d.getDay()] + ", " + MONTHS[d.getMonth()] + " " + d.getDate();
  }

  function monthNavHTML() {
    var months = monthsList(), i = months.indexOf(state.month);
    var prev = i > 0 ? months[i - 1] : null;
    var next = i > -1 && i < months.length - 1 ? months[i + 1] : null;
    return '<div class="monthnav">' +
      '<button class="mnav" id="mprev"' + (prev ? ' data-m="' + prev + '"' : ' disabled') + '>‹</button>' +
      '<span class="mlabel">' + esc(monthTitle(state.month)) + '</span>' +
      '<button class="mnav" id="mnext"' + (next ? ' data-m="' + next + '"' : ' disabled') + '>›</button>' +
    '</div>';
  }

  function wireMonthNav() {
    ["mprev", "mnext"].forEach(function (id) {
      var b = document.getElementById(id);
      if (b && b.getAttribute("data-m")) {
        b.onclick = function () { state.month = this.getAttribute("data-m"); window.scrollTo(0, 0); render(); };
      }
    });
  }

  function renderMonth() {
    el("header").innerHTML =
      '<div class="hdr">' +
        '<div class="eyebrow">Nurse Visit Sign-Up</div>' +
        monthNavHTML() +
        tabsHTML() +
      '</div>';
    var dates = datesInMonth(state.month);
    if (!dates.length) {
      el("content").innerHTML = '<div class="empty fade">No visits scheduled for ' + esc(monthTitle(state.month)) + '.</div>';
      wireTabs(); wireMonthNav();
      return;
    }
    var cells = "";
    for (var i = 0; i < dates.length; i++) {
      var iso = dates[i], d = parseDate(iso), c = countFor(iso);
      var cls = c.claimed === 0 ? "zero" : (c.claimed >= c.total ? "full" : "some");
      cells +=
        '<button class="day" data-date="' + iso + '">' +
          '<span class="dow">' + DOW[d.getDay()] + '</span>' +
          '<span class="num">' + d.getDate() + '</span>' +
          '<span class="cnt ' + cls + '">' + c.claimed + '/' + c.total + '</span>' +
        '</button>';
    }
    el("content").innerHTML =
      '<div class="gridwrap fade"><div class="grid">' + cells + '</div>' +
      '<div class="hint">Tap a day to view visits and sign up · updates live for everyone</div></div>';
    var btns = el("content").querySelectorAll(".day");
    for (var j = 0; j < btns.length; j++) {
      btns[j].onclick = (function (iso) { return function () { state.selectedDate = iso; window.scrollTo(0,0); render(); }; })(btns[j].getAttribute("data-date"));
    }
    wireTabs(); wireMonthNav();
  }

  // "Give me my schedule" -- every visit signed up for under the current name,
  // across all months, not just the one being viewed. Grouped by date because
  // that is how a shift is actually read.
  function renderMine() {
    var rows = myVisits(state.month);
    var period = state.month ? monthTitle(state.month) : "";
    el("header").innerHTML =
      '<div class="hdr">' +
        '<div class="eyebrow">Nurse Visit Sign-Up</div>' +
        '<div class="title">' + (state.nurse ? esc(state.nurse) + "'s visits" : "My visits") + '</div>' +
        (rows.length ? '<div class="covered">' + rows.length + ' visit' + (rows.length === 1 ? '' : 's') +
                       ' signed up' + (period ? ' in ' + esc(period) : '') + '</div>' : '') +
        tabsHTML() +
      '</div>';

    if (!state.nurse) {
      el("content").innerHTML =
        '<div class="empty fade">Set your name first and this will show everything you have signed up for.' +
        '<div class="emptyact"><button class="btn-signup" id="setname">Set your name</button></div></div>';
      wireTabs();
      var sn = document.getElementById("setname"); if (sn) sn.onclick = changeNurse;
      return;
    }
    if (!rows.length) {
      el("content").innerHTML = '<div class="empty fade">You have not signed up for any visits' +
        (period ? ' in ' + esc(period) : '') + '. Use the arrows above to check another month.</div>';
      wireTabs();
      return;
    }

    var html = '<div class="daywrap fade">', lastDate = null;
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].visit_date !== lastDate) {
        html += '<div class="section-label">' + esc(longDate(rows[i].visit_date)) + '</div>';
        lastDate = rows[i].visit_date;
      }
      html += visitCardHTML(rows[i]);
    }
    el("content").innerHTML = html + '</div>';
    wireTabs(); wireVisitButtons();
  }

  // Month calendar split by facility. Visits with no location are grouped under
  // their own heading rather than dropped -- 124 of the 341 rows have none, and
  // silently hiding a third of the schedule would be worse than an ugly heading.
  // Month calendar, one per facility, laid out the way the paper version is:
  // weekday columns, dates in the corner, every visit for that day listed in the
  // cell with the nurse's name colour coded.
  //
  // Deliberately different from the paper version in one way: unclaimed visits
  // are shown as "open" rather than omitted. A sign-up sheet whose calendar only
  // shows filled slots hides the thing you are looking for.
  function renderFacility() {
    var rows = visitsInMonth(state.month);
    el("header").innerHTML =
      '<div class="hdr">' +
        '<div class="eyebrow">Nurse Visit Sign-Up</div>' +
        monthNavHTML() +
        tabsHTML() +
      '</div>';

    if (!rows.length) {
      el("content").innerHTML = '<div class="empty fade">No visits scheduled for ' + esc(monthTitle(state.month)) + '.</div>';
      wireTabs(); wireMonthNav();
      return;
    }

    // index visits by facility then by date, so each cell is a cheap lookup
    var byFac = {};
    rows.forEach(function (v) {
      var f = v.location || NO_FACILITY;
      (byFac[f] = byFac[f] || {});
      (byFac[f][v.visit_date] = byFac[f][v.visit_date] || []).push(v);
    });

    var weeks = monthGrid(state.month);
    var html = '<div class="calwrap fade">';

    facilitiesIn(rows).forEach(function (fac) {
      var byDate = byFac[fac] || {};
      var all = Object.keys(byDate).reduce(function (a, d) { return a.concat(byDate[d]); }, []);
      var taken = all.filter(function (v) { return v.claimed_by; }).length;
      var patient = patientFor(rows, fac);

      html +=
        '<div class="calhead">' +
          '<div class="calmonth">' + esc(monthTitle(state.month)) + '</div>' +
          '<div class="calfac">' + esc(facilityLabel(fac)) +
            (patient ? ' <span class="calsep">/</span> <span class="calpat">' + esc(patient) + '</span>' : '') + '</div>' +
          '<div class="calcount">' + taken + ' of ' + all.length + ' covered</div>' +
        '</div>' +
        '<div class="calgrid">';

      DOW.forEach(function (d) { html += '<div class="caldow">' + d + '</div>'; });

      weeks.forEach(function (week) {
        week.forEach(function (date) {
          if (!date) { html += '<div class="calcell empty"></div>'; return; }
          var iso = isoOf(date);
          var list = (byDate[iso] || []).slice().sort(function (a, b) { return a.sort_order - b.sort_order; });
          html += '<div class="calcell' + (list.length ? '' : ' quiet') + '" data-date="' + iso + '">' +
                    '<div class="caldate">' + date.getDate() + '</div>';
          list.forEach(function (v) {
            html += '<div class="calslot' + (v.claimed_by ? '' : ' free') + '">' +
                      '<span class="caltime">' + esc(v.time_label) + '</span> ' +
                      (v.claimed_by ? nurseChipHTML(v.claimed_by)
                                    : '<span class="calopen">open</span>') +
                    '</div>';
          });
          html += '</div>';
        });
      });
      html += '</div>';
    });

    html += '<div class="hint">Tap any day to sign up or make changes</div></div>';
    el("content").innerHTML = html;

    var cells = el("content").querySelectorAll(".calcell[data-date]");
    for (var i = 0; i < cells.length; i++) {
      cells[i].onclick = (function (iso) {
        return function () { state.selectedDate = iso; window.scrollTo(0, 0); render(); };
      })(cells[i].getAttribute("data-date"));
    }
    wireTabs(); wireMonthNav();
  }

  function renderDay() {
    var iso = state.selectedDate, d = parseDate(iso), c = countFor(iso);
    el("header").innerHTML =
      '<div class="hdr">' +
        '<div class="eyebrow">Nurse Visit Sign-Up · ' + esc(periodLabel()) + '</div>' +
        '<div class="backrow"><button class="back" id="backbtn">‹ Back to month</button></div>' +
        '<div class="daytitle">' + DOW_LONG[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + '</div>' +
        '<div class="covered">' + c.claimed + '/' + c.total + ' covered</div>' +
      '</div>';

    var rows = state.visits.filter(function (v) { return v.visit_date === iso; })
      .sort(function (a, b) { return a.sort_order - b.sort_order; });

    var html = '<div class="daywrap fade">';
    var lastSection = null;
    for (var i = 0; i < rows.length; i++) {
      var v = rows[i];
      if (v.section !== lastSection) { html += '<div class="section-label">' + esc(v.section) + '</div>'; lastSection = v.section; }
      html += visitCardHTML(v);
    }
    html += '</div>';
    el("content").innerHTML = html;

    var back = document.getElementById("backbtn");
    if (back) back.onclick = function () { state.selectedDate = null; window.scrollTo(0,0); render(); };
    wireVisitButtons();
  }

  function splitTime(label) {
    // "6:00 AM" -> ["6:00","AM"]
    var m = String(label || "").match(/^(.*?)\s*(AM|PM)?$/i);
    if (m && m[2]) return [m[1], m[2].toUpperCase()];
    return [label || "", ""];
  }

  function renderEnvBar() {
    if (!USE_DEV) return;                       // live site shows nothing
    el("envbar").className = "envbar";
    el("envbar").innerHTML =
      'DEV DATA · reading and writing <code>' + esc(TABLE) + '</code> · real sign-ups are not affected';
  }

  // ---- boot ----
  //
  // getSession() must be awaited before the first query. supabase-js restores a
  // persisted session ASYNCHRONOUSLY, so firing loadAll() immediately would run
  // it as `anon` even for a nurse who signed in yesterday -- which would show the
  // passcode gate to someone already holding a valid session, every reload.
  (async function boot() {
    renderEnvBar();
    renderFoot();
    try {
      var sess = await sb.auth.getSession();
      state.signedIn = !!(sess && sess.data && sess.data.session);
    } catch (e) { state.signedIn = false; }
    renderWhoami();
    await loadAll();
    if (!state.locked) subscribeLive();
  })();
})();
</script>
</body>
</html>
